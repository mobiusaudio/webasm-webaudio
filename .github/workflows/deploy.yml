name: Build and Deploy Wasm Audio

on:
  push:
    branches: ["master"] # Change this if your default branch is 'master'
  workflow_dispatch:   # Allows you to trigger the build manually from the Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build C++ to Wasm
        run: |
          emcmake cmake -B build
          cmake --build build

      - name: Prepare Deployment Folder
        # Move the HTML and the newly compiled Wasm/JS files into a single 'dist' folder
        run: |
          mkdir dist
          cp index.html dist/
          cp build/audio_app.js dist/
          cp build/audio_app.wasm dist/
          cp coi-serviceworker.js dist/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4