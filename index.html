<!DOCTYPE html>
<html lang="en">
<head>
    <script src="coi-serviceworker.js"></script>
    <meta charset="UTF-8">
    <title>C++ Wasm Audio I/O</title>
    <style> body { font-family: sans-serif; padding: 2rem; } </style>
</head>
<body>
    <h2>C++ Real-Time WebAudio Gain</h2>
    <button id="startBtn">1. Start Audio & Microphone</button>
    <br><br>
    
    <label for="gainSlider">2. Adjust Gain:</label>
    <input type="range" id="gainSlider" min="0" max="2" step="0.01" value="0.5" disabled>

    <script src="audio_app.js"></script> 
    
    <script>
        const startBtn = document.getElementById('startBtn');
        const gainSlider = document.getElementById('gainSlider');

        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            
            // 1. Trigger C++ to create AudioContext and start Worklet Thread
            Module.ccall('InitAudio', null, [], []);

            // 2. Wait for C++ to finish building the node
            window.addEventListener('WorkletReady', async () => {
                try {
                    // 3. Request Microphone Access
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    
                    // 4. Connect Microphone to the Wasm Worklet Node
                    const micSource = window.audioContext.createMediaStreamSource(stream);
                    micSource.connect(window.wasmWorkletNode);

                    gainSlider.disabled = false;
                    startBtn.innerText = "Audio Running!";
                    console.log("Success: Mic -> C++ Wasm -> Speakers");
                } catch (err) {
                    console.error("Microphone access denied.", err);
                    startBtn.innerText = "Mic Access Failed";
                }
            });
        });

        // Send slider values back to C++ in real-time
        gainSlider.addEventListener('input', (e) => {
            Module.ccall('SetGain', null, ['number'], [parseFloat(e.target.value)]);
        });
    </script>
</body>
</html>
