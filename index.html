<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ImGui Audio Rig</title>
    <script src="coi-serviceworker.js"></script>
    <style>
        body { margin: 0; background-color: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        /* Emscripten binds to the canvas with id="canvas" by default */
        canvas { border: 0px none; background-color: black; width: 800px; height: 600px; }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script>
        // 1. Tell Emscripten EXACTLY which canvas to draw ImGui onto
        var Module = {
            canvas: document.getElementById('canvas')
        };

        // 2. Microphone routing function
        window.ConnectMicrophone = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
                    video: false
                });
                const micSource = window.audioContext.createMediaStreamSource(stream);
                micSource.connect(window.wasmWorkletNode);
                console.log("Mic successfully routed to C++!");
            } catch (err) {
                console.error("Microphone access denied.", err);
            }
        };
    </script>

    <script src="build/audio_app.js"></script>
</body>
</html>
